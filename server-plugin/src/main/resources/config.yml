# Fenza-PvP-Whitelisting Configuration

# When true, ONLY players on the tracked-players list will be required to have the mod on join.
# Untracked players can join freely without needing the companion mod.
# When false, ALL players joining the server must have the mod.
check-specific-players-only: true

# Players required to have the client mod installed on join
# Add or remove players via the in-game command: /modcheck <player>
tracked-players: []

# How long (in seconds) to wait for the client mod handshake before kicking
handshake-timeout: 10

# Cryptographic Integrity & Anti-Tamper Verification
integrity-check:
  # Reject client mods that do not provide a valid cryptographic challenge signature
  require-signature: true
  # Enforce matching class bytecode hash (prevents code modification / recompilation)
  enforce-class-hash: true
  # Official SHA-256 hashes of compiled Fenza client classes
  allowed-class-hashes:
    - "c719f339a2be623068b9e448d4e9b0955a66580e1236df3bb41140aadae97486" # Modern (26.1 - 26.2+)
    - "f4b712335283396b5409dc72709c70385a8c032ff926067e5e04ce6469ed3311" # Legacy (1.21.x)
  # Message shown when client mod is altered or recompiled
  kick-message-tampered: "§c[Fenza] Client mod integrity verification failed!\n§7Your client mod has been altered, modified, or is unofficial."

# Message shown when player doesn't have the required mod
kick-message-no-mod: "§cYou are missing a required mod to join this server."

# Message shown when player's mod fails to respond in time
kick-message-no-response: "§cConnection verification timed out. Please try again."

# Message shown when player has a banned mod (%mod% is replaced with the mod id)
kick-message-banned-mod: "§cYou have a prohibited mod installed: %mod%"

# Whether to log player mod lists to console
log-mod-lists: true

# Discord Webhook configuration
# Sends real-time mod verification reports and kick alerts to your Discord channel
discord-webhook:
  enabled: true
  url: "" # Insert your Discord Webhook URL here
  # Alert to Discord when a tracked player is kicked for not having the mod
  alert-on-missing-mod: true

# List of banned mod IDs (players with these mods will be kicked)
banned-mods: []
#  - "wurst"
#  - "meteor-client"
#  - "aristois"
